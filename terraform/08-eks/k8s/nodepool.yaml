# ─────────────────────────────────────────────────────────────────────
# Karpenter v1 — NodePool / EC2NodeClass
#
#   helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
#     --version "1.x.x" -n kube-system \
#     --set "settings.clusterName=<CLUSTER>" \
#     --set "settings.interruptionQueue=<QUEUE_NAME>"
#
#   그다음 이 파일을 kubectl apply -f 합니다.
#   CLUSTER_NAME 자리를 바꿔 주세요.
# ─────────────────────────────────────────────────────────────────────
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels:
        workload: general
    spec:
      # ★ v1에서 nodeClassRef에 group/kind가 필수가 되었습니다.
      #   v1beta1 YAML을 그대로 쓰면 거부됩니다.
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # ★ v1에서 expireAfter / terminationGracePeriod가
      #   NodePool.spec.template.spec 로 옮겨왔습니다.
      expireAfter: 720h          # 30일마다 노드를 새로. AMI 패치가 자동으로 들어옵니다
      terminationGracePeriod: 48h

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64", "arm64"]   # 둘 다 열어두면 Karpenter가 싼 쪽을 고릅니다
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]                # 구형 세대 제외 — 비싸고 느립니다

  # ★★ v1에서 가장 많이 걸리는 부분 ★★
  #
  #   consolidationPolicy: WhenUnderutilized  →  WhenEmptyOrUnderutilized (이름 변경)
  #   그리고 consolidateAfter가 **필수**가 되었습니다.
  #   v1beta1에서 빠뜨려도 되던 값이라, 그대로 올리면 거부됩니다.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

    budgets:
      - nodes: "10%"             # 한 번에 10%까지만 비움
      - nodes: "0"               # 업무 시간에는 아예 안 건드림
        schedule: "0 9 * * mon-fri"
        duration: 9h

  limits:
    cpu: "200"
    memory: 400Gi

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # ★ v1에서 amiFamily만으로는 안 되고 amiSelectorTerms가 필수입니다.
  #   "최신 AMI가 조용히 들어오는" 사고를 막기 위한 변경입니다.
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest        # 버전을 못 박으려면 al2023@v20250101

  role: CLUSTER_NAME-eks-node

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME

  # ★ IMDSv2 강제 (모듈 6과 같은 이유)
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    kubernetes.io/cluster/CLUSTER_NAME: owned
